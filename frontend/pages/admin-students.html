<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students — Placement Portal</title>
<link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-shell">
  <div id="sidebar-mount"></div>
  <main class="main">
    <div class="page-header">
      <div><h1>Students</h1><p>All registered students across departments.</p></div>
      <input type="text" id="search" placeholder="Search by name or department..." style="width:260px;" oninput="applyFilter()">
    </div>
    <div class="card">
      <div class="table-wrap">
        <table>
          <thead><tr><th>Name</th><th>Email</th><th>Department</th><th>CGPA</th><th>Backlogs</th><th>Skills</th></tr></thead>
          <tbody id="students-body"><tr><td colspan="6" class="muted center">Loading...</td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<div id="toast"></div>

<script src="../js/api.js"></script>
<script src="../js/layout.js"></script>
<script>
  requireRole("ADMIN");
  renderSidebar("students");

  let allStudents = [];

  function rowHtml(s) {
    return `
      <tr>
        <td><strong>${s.fullName}</strong></td>
        <td>${s.email}</td>
        <td>${s.department}</td>
        <td>${s.cgpa != null ? s.cgpa.toFixed(2) : "—"}</td>
        <td>${s.backlogs}</td>
        <td>${(s.skills||[]).slice(0,3).map(sk => `<span class="skill-tag">${sk}</span>`).join("") || "—"}</td>
      </tr>
    `;
  }

  function applyFilter() {
    const q = document.getElementById("search").value.toLowerCase();
    const filtered = allStudents.filter(s =>
      (s.fullName||"").toLowerCase().includes(q) || (s.department||"").toLowerCase().includes(q)
    );
    document.getElementById("students-body").innerHTML = filtered.length
      ? filtered.map(rowHtml).join("")
      : `<tr><td colspan="6" class="muted center" style="padding:30px;">No students found.</td></tr>`;
  }

  async function load() {
    try {
      allStudents = await api.get("/admin/students");
      applyFilter();
    } catch (err) {
      showToast(err.message, "error");
    }
  }
  load();
</script>
</body>
</html>
